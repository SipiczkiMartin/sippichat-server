version: "3.9"

services:
  postgres:
    image: postgres:17

    container_name: sippichat-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpassword
      POSTGRES_DB: chatdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: